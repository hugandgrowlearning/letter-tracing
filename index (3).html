function sayLetter(c){
 if(!soundOn)return;
 const name=c.toUpperCase();
 if(name==='A'){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  recordedA.pause(); recordedA.currentTime=0;
  recordedA.play().catch(()=>speak('the letter A'));
 } else { recordedA.pause(); speak(letterPronunciation[name]||name); }
}

 let particles=[],start=performance.now(),lastBurst=-1;const ticket=fireworksToken;
