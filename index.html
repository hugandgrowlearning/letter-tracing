<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Heart Letter Tracing</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#079fdf}*{box-sizing:border-box}body{margin:0;overscroll-behavior:none}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff;outline-offset:3px}.app{height:100dvh;min-height:360px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 20%,#21b7f0 0%,#079cda 65%,#0784c8 100%)}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;min-height:64px}.tools{display:flex;align-items:center;gap:8px}.tool{border:0;background:#066ab4a6;color:white;border-radius:13px;padding:9px 14px;min-height:46px;font-size:clamp(16px,2vw,23px)}.tool:hover{background:#065b9d}.tool:disabled{opacity:.4;cursor:default}.heading{font-weight:700;font-size:clamp(20px,3vw,30px)}#chooser{flex:1;overflow:auto;padding:12px 5vw 28px}#alphabet{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,2vh,24px);height:100%;align-items:stretch}#alphabet button{border:0;background:transparent;color:#d9f4ff;font-size:clamp(36px,7vh,82px);font-weight:200;border-radius:14px;min-height:60px}#alphabet button:hover,#alphabet button:focus-visible{background:#ffffff29}#workspace{display:none;flex:1;min-height:0;position:relative;overflow:hidden}#drawing{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}.guide{stroke:#b4e7f4;stroke-width:1.2;opacity:.55}.letter{fill:none;stroke:#eafaff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.completed{fill:none;stroke:#ffd4e5;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.start-dot{fill:#f34e81;stroke:white;stroke-width:2}.start-num{fill:white;font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.hint{fill:#fff;opacity:.9;font-size:14px;text-anchor:middle}.heart{font-size:15px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.status{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#006caaad;border-radius:18px;padding:8px 18px;text-align:center;font-size:clamp(13px,1.7vw,18px);pointer-events:none;max-width:90%}#celebrate{display:none;position:absolute;inset:0;pointer-events:none;align-items:center;justify-content:center;font-size:clamp(36px,7vw,90px);font-weight:800;text-shadow:0 4px 12px #006eaa;animation:pop .55s ease-out}@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}.confetti{position:absolute;font-size:30px;animation:fly 1.5s ease-out forwards;pointer-events:none}@keyframes fly{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(400deg);opacity:0}}@media(max-width:600px){header{padding:7px;gap:3px}.tools{gap:4px}.tool{padding:8px;min-height:42px;font-size:16px}.heading{font-size:18px}#alphabet{grid-template-columns:repeat(5,1fr)}#alphabet button{font-size:42px}}
</style>
</head>
<body><div class="app"><header><div class="tools"><button class="tool" id="back" aria-label="Back to alphabet">← Letters</button><span class="heading" id="heading">Choose a letter</span></div><div class="tools"><button class="tool" id="demo" title="Watch stroke order">▶ Demo</button><button class="tool" id="reset" title="Start over">↻ Reset</button><button class="tool" id="sound" title="Toggle sound">🔊</button><button class="tool" id="next">Next →</button></div></header><main id="chooser"><div id="alphabet"></div></main><section id="workspace"><svg id="drawing" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet" aria-label="Interactive tracing area"><g id="guides"></g><g id="letter"></g><g id="hearts"></g><g id="dots"></g></svg><div id="celebrate">Amazing! 🌟</div><div class="status" id="status" aria-live="polite">Touch the pink dot to begin!</div></section></div>
<script>
'use strict';
// Each letter is defined by an ordered array of strokes. Each stroke is an array of [x,y] points in a 100x100 writing box.
// These are original simple classroom-print uppercase letterforms, not extracted from any app.
const L={
A:[[[10,95],[50,5]],[[50,5],[90,95]],[[25,61],[75,61]]],
B:[[[15,5],[15,95]],[[15,5],[60,5],[78,15],[80,31],[70,46],[15,48]],[[15,48],[65,48],[83,59],[83,80],[70,95],[15,95]]],
C:[[[85,18],[68,5],[32,5],[15,23],[10,50],[15,77],[32,95],[68,95],[85,82]]],
D:[[[15,5],[15,95]],[[15,5],[52,5],[77,20],[87,50],[77,80],[52,95],[15,95]]],
E:[[[80,5],[15,5],[15,95],[80,95]],[[15,50],[68,50]]],
F:[[[15,95],[15,5],[80,5]],[[15,50],[68,50]]],
G:[[[85,19],[68,5],[32,5],[15,22],[10,50],[15,78],[32,95],[70,95],[85,80],[85,55],[55,55]]],
H:[[[15,5],[15,95]],[[85,5],[85,95]],[[15,50],[85,50]]],
I:[[[25,5],[75,5]],[[50,5],[50,95]],[[25,95],[75,95]]],
J:[[[20,5],[85,5]],[[75,5],[75,75],[62,94],[38,95],[20,83]]],
K:[[[15,5],[15,95]],[[85,5],[15,56]],[[45,38],[88,95]]],
L:[[[15,5],[15,95],[85,95]]],
M:[[[10,95],[10,5],[50,57],[90,5],[90,95]]],
N:[[[15,95],[15,5],[85,95],[85,5]]],
O:[[[50,5],[23,13],[10,36],[10,65],[23,87],[50,95],[77,87],[90,65],[90,36],[77,13],[50,5]]],
P:[[[15,95],[15,5],[62,5],[83,18],[83,37],[62,52],[15,52]]],
Q:[[[50,5],[23,13],[10,36],[10,65],[23,87],[50,95],[77,87],[90,65],[90,36],[77,13],[50,5]],[[60,75],[93,99]]],
R:[[[15,95],[15,5],[62,5],[83,18],[83,37],[62,52],[15,52]],[[50,52],[87,95]]],
S:[[[83,17],[66,5],[33,5],[16,20],[18,39],[40,49],[66,53],[84,67],[82,83],[66,95],[32,95],[15,82]]],
T:[[[10,5],[90,5]],[[50,5],[50,95]]],
U:[[[15,5],[15,70],[25,90],[50,95],[75,90],[85,70],[85,5]]],
V:[[[10,5],[50,95],[90,5]]],
W:[[[5,5],[25,95],[50,42],[75,95],[95,5]]],
X:[[[12,5],[88,95]],[[88,5],[12,95]]],
Y:[[[10,5],[50,51],[90,5]],[[50,51],[50,95]]],
Z:[[[12,5],[88,5],[12,95],[88,95]]]
};
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('drawing');
const $=id=>document.getElementById(id);let current='A',stroke=0,progress=0,active=false,finished=false,demoing=false,seq=0,lastHeart=-1;
const box={x:190,y:55,w:220,h:280};const map=p=>[box.x+p[0]/100*box.w,box.y+p[1]/100*box.h];
function el(tag,attrs,parent){let e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);parent.appendChild(e);return e}
function pathPoints(pts){return pts.map((p,i)=>(i?'L':'M')+map(p).join(' ')).join(' ')}
function sample(points){let a=[];for(let i=0;i<points.length-1;i++){let p=map(points[i]),q=map(points[i+1]),d=Math.hypot(q[0]-p[0],q[1]-p[1]),n=Math.max(1,Math.ceil(d/2));for(let j=0;j<n;j++)a.push([p[0]+(q[0]-p[0])*j/n,p[1]+(q[1]-p[1])*j/n])}a.push(map(points.at(-1)));return a}
let samples=[];function speak(t){if(!soundOn||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.85;window.speechSynthesis.speak(u)}let soundOn=true;
function chime(){if(!soundOn)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let c=new C();[523,659,784].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);let t=c.currentTime+i*.12;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start(t);o.stop(t+.27)});setTimeout(()=>c.close(),900)}catch(e){}}
function status(t){$('status').textContent=t}
function draw(){let guides=$('guides'),letter=$('letter'),dots=$('dots');guides.replaceChildren();letter.replaceChildren();dots.replaceChildren();for(let y of [box.y,box.y+box.h/2,box.y+box.h])el('line',{x1:0,y1:y,x2:600,y2:y,class:'guide'},guides);samples=L[current].map(sample);L[current].forEach((s,i)=>el('path',{d:pathPoints(s),class:'letter',id:'path'+i},letter));updateDot()}
function updateDot(){let dots=$('dots');dots.replaceChildren();if(stroke>=samples.length)return;let p=samples[stroke][0];el('circle',{cx:p[0],cy:p[1],r:13,class:'start-dot'},dots);let t=el('text',{x:p[0],y:p[1]+.5,class:'start-num'},dots);t.textContent=stroke+1}
function heart(p){let h=el('text',{x:p[0],y:p[1],class:'heart'},$('hearts'));h.textContent=['💗','💖','💕','💝'][Math.floor(Math.random()*4)]}
function markTo(index){let a=samples[stroke];for(let k=lastHeart+1;k<=index;k++){if(k%7===0||k===a.length-1)heart(a[k])}lastHeart=index}
function reset(){seq++;active=false;demoing=false;stroke=0;progress=0;lastHeart=-1;finished=false;$('hearts').replaceChildren();$('celebrate').style.display='none';draw();status('Touch the pink dot, then follow the letter!')}
function select(c){current=c;$('chooser').style.display='none';$('workspace').style.display='block';$('heading').textContent='Letter '+c;reset();speak(c)}
function showChooser(){seq++;active=false;demoing=false;$('workspace').style.display='none';$('chooser').style.display='block';$('heading').textContent='Choose a letter'}
function nearest(a,p,lo,hi){let best=-1,dist=1e9;for(let i=lo;i<=hi;i++){let d=Math.hypot(a[i][0]-p[0],a[i][1]-p[1]);if(d<dist){dist=d;best=i}}return {index:best,dist}}
function point(evt){let r=svg.getBoundingClientRect(),scale=Math.min(r.width/600,r.height/400),ox=(r.width-600*scale)/2,oy=(r.height-400*scale)/2;return [(evt.clientX-r.left-ox)/scale,(evt.clientY-r.top-oy)/scale]}
function start(evt){if(finished||demoing)return;let p=point(evt),a=samples[stroke];if(!a)return;if(Math.hypot(p[0]-a[0][0],p[1]-a[0][1])>24){status('Start at the pink dot!');return}active=true;progress=0;lastHeart=-1;svg.setPointerCapture(evt.pointerId);markTo(0);status('Great! Keep following the white line.')}
function move(evt){if(!active)return;let p=point(evt),a=samples[stroke],n=nearest(a,p,progress,Math.min(a.length-1,progress+18));if(n.dist>24){status('Stay close to the letter!');return}if(n.index>progress){progress=n.index;markTo(progress)}if(progress>=a.length-3)completeStroke()}
function stop(){if(!active)return;active=false;if(!finished)status('Touch the pink dot to continue this stroke.');if(progress>0&&!finished){ // Resume from last reached point, keeping completed hearts.
 let a=samples[stroke];a.splice(0,progress);progress=0;lastHeart=-1;updateDot();}}
function completeStroke(){active=false;stroke++;progress=0;lastHeart=-1;if(stroke>=samples.length){finished=true;$('dots').replaceChildren();status('You traced '+current+'! Great work!');celebrate();chime();speak('Great job! Letter '+current)}else{updateDot();status('Wonderful! Start at dot '+(stroke+1)+'.');chime()}}
function celebrate(){let c=$('celebrate');c.style.display='flex';c.textContent='Amazing! 🌟';for(let i=0;i<22;i++){let e=document.createElement('span');e.className='confetti';e.textContent=['💖','⭐','🎉','🌈'][i%4];e.style.left=(15+Math.random()*70)+'%';e.style.top=(20+Math.random()*55)+'%';e.style.setProperty('--dx',(Math.random()*500-250)+'px');e.style.setProperty('--dy',(Math.random()*350-175)+'px');c.appendChild(e);setTimeout(()=>e.remove(),1600)}}
const sleep=t=>new Promise(r=>setTimeout(r,t));async function demo(){if(demoing)return;reset();demoing=true;let ticket=++seq;status('Watch the stroke order!');for(let s=0;s<samples.length;s++){if(ticket!==seq)return;stroke=s;updateDot();lastHeart=-1;for(let i=0;i<samples[s].length;i+=3){if(ticket!==seq)return;markTo(i);await sleep(18)}markTo(samples[s].length-1);await sleep(250)}if(ticket!==seq)return;demoing=false;stroke=0;await sleep(450);if(ticket===seq)reset()}
for(let c of Object.keys(L)){let b=document.createElement('button');b.textContent=c;b.setAttribute('aria-label','Trace letter '+c);b.onclick=()=>select(c);$('alphabet').appendChild(b)}
$('back').onclick=showChooser;$('reset').onclick=reset;$('demo').onclick=demo;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇'};$('next').onclick=()=>select(String.fromCharCode(65+(current.charCodeAt(0)-64)%26));svg.addEventListener('pointerdown',start);svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
</script></body></html>
